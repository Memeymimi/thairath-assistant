<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thairath Plus - Editorial Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        ::selection { background-color: #fce7f3; color: #831843; }
        .tab-active { color: #db2777; font-weight: 500; }
        .tab-active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background-color: #f472b6; }
    </style>
</head>
<body class="min-h-screen bg-[#fdfafb] text-gray-800 p-4 md:p-8">

    <header class="max-w-7xl mx-auto mb-8 flex flex-col items-center justify-center border-b border-pink-100 pb-6">
        <div class="flex items-center gap-2 text-pink-500 mb-2">
            <i data-lucide="heart" class="w-4 h-4 opacity-70"></i>
            <i data-lucide="heart" class="w-3 h-3 opacity-50"></i>
            <i data-lucide="heart" class="w-4 h-4 opacity-70"></i>
        </div>
        <h1 class="text-2xl tracking-widest uppercase font-light text-gray-900">Thairath Plus</h1>
        <p class="text-xs tracking-widest text-gray-400 uppercase mt-2">Editorial Assistant</p>
    </header>

    <main class="max-w-7xl mx-auto flex flex-col gap-12">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            <section class="flex flex-col w-full">
                <label class="text-sm uppercase tracking-wider text-gray-500 mb-3 flex items-center gap-2 font-medium">1. หน้าต่างแปะ Text</label>
                <div class="relative flex-grow flex flex-col bg-white border border-pink-100 rounded-sm shadow-sm focus-within:border-pink-300 focus-within:ring-1 focus-within:ring-pink-100 transition-all">
                    <div id="backdrop" class="absolute inset-0 p-5 text-gray-800 whitespace-pre-wrap break-words pointer-events-none overflow-hidden" style="font-family: inherit; font-size: 1rem; line-height: 1.625;"></div>
                    <textarea id="inputText" class="relative z-10 w-full min-h-[500px] p-5 bg-transparent outline-none resize-none text-transparent caret-pink-500 overflow-y-auto" style="font-family: inherit; font-size: 1rem; line-height: 1.625;" placeholder="วางเนื้อหาต้นฉบับที่นี่..."></textarea>
                </div>
                
                <div id="errorBox" class="hidden mt-3 text-red-500 text-sm flex items-center gap-1 bg-red-50 p-3 rounded-sm border border-red-100"></div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <button id="btnProofread" class="bg-white hover:bg-red-50 text-red-600 uppercase tracking-wider py-4 text-sm transition-colors border border-red-200 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 rounded-sm font-medium shadow-sm">
                        <i data-lucide="search" class="w-4 h-4"></i> <span>Proofread</span>
                    </button>
                    <button id="btnProcess" class="bg-pink-50 hover:bg-pink-100 text-pink-700 uppercase tracking-wider py-4 text-sm transition-colors border border-pink-200 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 rounded-sm font-medium shadow-sm">
                        <i data-lucide="sparkles" class="w-4 h-4"></i> <span>Process Text</span>
                    </button>
                </div>
            </section>

            <section class="flex flex-col w-full h-full">
                <label class="text-sm uppercase tracking-wider text-gray-500 mb-3 flex items-center justify-between font-medium">
                    <span>2. หน้าต่าง Proofread</span>
                    <span id="issueCount" class="hidden text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full"></span>
                </label>
                <div class="flex-grow bg-white border border-gray-100 rounded-sm shadow-sm overflow-hidden flex flex-col">
                    <div class="p-4 bg-gray-50 border-b border-gray-100 flex items-center gap-2 text-sm text-gray-500">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i> ผลการตรวจสอบจาก AI
                    </div>
                    <div id="proofreadContent" class="p-4 overflow-y-auto min-h-[500px]">
                        <div class="h-full min-h-[400px] flex flex-col items-center justify-center text-gray-400 text-center">
                            <i data-lucide="check-circle-2" class="w-10 h-10 text-gray-300 mb-4"></i>
                            <p class="text-sm">เนื้อหาพร้อมใช้งาน หรือยังไม่ได้ทำการตรวจสอบ</p>
                            <p class="text-xs mt-1 text-gray-400">กดปุ่ม Proofread ด้านซ้ายเพื่อเริ่มสแกนคำผิด</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="w-full border-t border-pink-100 pt-8">
            <label class="text-sm uppercase tracking-wider text-gray-500 mb-6 flex items-center gap-2 font-medium">3. ผลลัพธ์สำหรับจัดหน้า (Process Text)</label>
            <div class="bg-white p-6 rounded-sm shadow-sm border border-pink-100">
                <div class="flex flex-wrap border-b border-pink-100 mb-6 gap-4 lg:gap-8" id="tabsContainer">
                    <button data-tab="website" class="tab-btn pb-3 text-sm uppercase tracking-wider transition-all relative whitespace-nowrap tab-active">Website</button>
                    <button data-tab="facebook" class="tab-btn pb-3 text-sm uppercase tracking-wider transition-all relative whitespace-nowrap text-gray-400 hover:text-gray-600">Facebook</button>
                    <button data-tab="instagram" class="tab-btn pb-3 text-sm uppercase tracking-wider transition-all relative whitespace-nowrap text-gray-400 hover:text-gray-600">Instagram</button>
                    <button data-tab="infocus" class="tab-btn pb-3 text-sm uppercase tracking-wider transition-all relative whitespace-nowrap text-gray-400 hover:text-gray-600">In Focus</button>
                </div>

                <div class="flex justify-between items-center mb-3">
                    <label id="tabDesc" class="text-xs text-gray-400 tracking-wider flex items-center gap-1"><i data-lucide="file-text" class="w-3 h-3"></i> เนื้อหาไร้ลิงก์ดิบ + อ้างอิง</label>
                    <button id="btnCopy" class="hidden text-xs flex items-center gap-1 text-pink-500 hover:text-pink-700 transition-colors bg-pink-50 px-3 py-1.5 rounded-sm">
                        <i data-lucide="copy" class="w-3 h-3"></i> <span>คัดลอกไปใช้งาน</span>
                    </button>
                </div>

                <div class="relative flex-grow flex flex-col w-full">
                    <div id="igStats" class="hidden mb-4 flex flex-col items-center justify-center bg-pink-50/50 py-5 px-6 rounded-sm border border-pink-100">
                        <div class="flex items-baseline gap-6 md:gap-10">
                            <div class="text-center flex items-baseline gap-2">
                                <span id="wordCount" class="text-4xl md:text-5xl font-light text-pink-500">0</span><span class="text-sm uppercase tracking-widest text-pink-300">words</span>
                            </div>
                            <div class="w-px h-10 bg-pink-200/50"></div>
                            <div class="text-center flex items-baseline gap-2">
                                <span id="charCount" class="text-4xl md:text-5xl font-light text-pink-500">0</span><span class="text-sm uppercase tracking-widest text-pink-300">characters</span>
                            </div>
                        </div>
                    </div>
                    <div id="processLoading" class="hidden w-full min-h-[300px] bg-pink-50/30 border border-pink-50 flex flex-col items-center justify-center text-pink-300 gap-3 rounded-sm shadow-inner">
                        <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i><span class="text-xs uppercase tracking-widest">Generating Format...</span>
                    </div>
                    <textarea id="outputText" class="w-full min-h-[300px] p-5 bg-gray-50/50 border border-gray-200 outline-none focus:border-pink-300 focus:ring-1 focus:ring-pink-100 resize-none rounded-sm text-gray-800 leading-loose transition-all overflow-hidden" placeholder="ผลลัพธ์จัดหน้าจะแสดงที่นี่ หลังจากกดปุ่ม Process Text..."></textarea>
                </div>
            </div>
        </div>
    </main>
    <footer class="max-w-7xl mx-auto mt-16 text-center pb-8 border-t border-gray-100 pt-8"><p class="text-[10px] text-gray-300 uppercase tracking-widest">Internal Use Only · Built for Editorial Team</p></footer>

    <script>
        lucide.createIcons();
        
        let state = {
            inputText: '', spellIssues: [], contextIssues: [], activeTab: 'website',
            outputs: { website: '', facebook: '', instagram: '', infocus: '' }
        };

        const descriptions = { website: 'เนื้อหาไร้ลิงก์ดิบ + อ้างอิง', facebook: 'จุดคั่นบรรทัด + แท็ก', instagram: 'นับคำ Real-time', infocus: 'สรุปเนื้อหา 3-4 ข้อ' };
        
        const els = {
            input: document.getElementById('inputText'), backdrop: document.getElementById('backdrop'), output: document.getElementById('outputText'),
            btnProofread: document.getElementById('btnProofread'), btnProcess: document.getElementById('btnProcess'), btnCopy: document.getElementById('btnCopy'),
            proofreadContent: document.getElementById('proofreadContent'), issueCount: document.getElementById('issueCount'),
            tabsContainer: document.getElementById('tabsContainer'), tabDesc: document.getElementById('tabDesc'), errorBox: document.getElementById('errorBox'),
            igStats: document.getElementById('igStats'), wordCount: document.getElementById('wordCount'), charCount: document.getElementById('charCount'), processLoading: document.getElementById('processLoading')
        };

        function showError(msg) { els.errorBox.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4"></i> ${msg}`; els.errorBox.classList.remove('hidden'); lucide.createIcons(); }
        function hideError() { els.errorBox.classList.add('hidden'); }

        els.input.addEventListener('input', (e) => {
            state.inputText = e.target.value;
            els.input.style.height = 'auto'; els.input.style.height = Math.max(500, els.input.scrollHeight) + 'px';
            renderHighlights();
        });

        els.input.addEventListener('scroll', () => { els.backdrop.scrollTop = els.input.scrollTop; });
        els.output.addEventListener('input', (e) => { state.outputs[state.activeTab] = e.target.value; updateStats(); });

        els.tabsContainer.addEventListener('click', (e) => {
            if(e.target.classList.contains('tab-btn')) {
                document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active', 'text-pink-600'); btn.classList.add('text-gray-400'); });
                e.target.classList.add('tab-active', 'text-pink-600'); e.target.classList.remove('text-gray-400');
                state.activeTab = e.target.getAttribute('data-tab');
                els.tabDesc.innerHTML = `<i data-lucide="file-text" class="w-3 h-3"></i> ${descriptions[state.activeTab]}`; lucide.createIcons();
                els.output.value = state.outputs[state.activeTab];
                updateStats(); toggleCopyBtn();
            }
        });

        function updateStats() {
            if(state.activeTab === 'instagram' && state.outputs.instagram) {
                els.igStats.classList.remove('hidden');
                let text = els.output.value;
                els.charCount.innerText = text.length;
                els.wordCount.innerText = text.split(/[\s\n]+/).filter(w => w.trim().length > 0).length * 2;
            } else { els.igStats.classList.add('hidden'); }
        }

        function toggleCopyBtn() {
            if(state.outputs[state.activeTab]) els.btnCopy.classList.remove('hidden'); else els.btnCopy.classList.add('hidden');
        }

        els.btnCopy.addEventListener('click', () => {
            const ta = document.createElement("textarea"); ta.value = els.output.value; ta.style.position = "absolute"; ta.style.left = "-999999px"; document.body.appendChild(ta);
            ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
            els.btnCopy.innerHTML = `<i data-lucide="check-circle-2" class="w-3 h-3"></i> <span>คัดลอกแล้ว</span>`; lucide.createIcons();
            setTimeout(() => { els.btnCopy.innerHTML = `<i data-lucide="copy" class="w-3 h-3"></i> <span>คัดลอกไปใช้งาน</span>`; lucide.createIcons(); }, 2000);
        });

        function renderHighlights() {
            const allWords = [...state.spellIssues.map(i=>i.wrong), ...state.contextIssues.map(i=>i.wrong)].filter(w=>w.trim());
            if(!allWords.length) { els.backdrop.innerText = state.inputText + (state.inputText.endsWith('\n')?'\n':''); return; }
            
            const escaped = allWords.sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regex = new RegExp(`(${escaped.join('|')})`, 'g');
            const parts = state.inputText.split(regex);
            
            els.backdrop.innerHTML = parts.map(part => {
                if(state.spellIssues.find(i=>i.wrong===part)) return `<mark data-wrong="${part}" class="text-red-700 bg-red-200 rounded-sm px-0.5 bg-opacity-80 border border-red-300">${part}</mark>`;
                if(state.contextIssues.find(i=>i.wrong===part)) return `<mark data-wrong="${part}" class="text-amber-700 bg-amber-200 rounded-sm px-0.5 bg-opacity-80 border border-amber-300">${part}</mark>`;
                return part.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }).join('') + (state.inputText.endsWith('\n')?'<br>':'');
        }

        window.handleReplace = function(wrong, correct, type) {
            state.inputText = state.inputText.replaceAll(wrong, correct); els.input.value = state.inputText;
            ['website','facebook','instagram','infocus'].forEach(k => { state.outputs[k] = state.outputs[k].replaceAll(wrong, correct); });
            if(type==='spell') state.spellIssues = state.spellIssues.filter(i=>i.wrong!==wrong);
            else state.contextIssues = state.contextIssues.filter(i=>i.wrong!==wrong);
            
            els.output.value = state.outputs[state.activeTab];
            renderHighlights(); renderIssues();
        };

        window.locateIssue = function(wrong) {
            const marks = document.querySelectorAll(`mark[data-wrong="${wrong}"]`);
            if(marks.length > 0) {
                const pos = Math.max(0, marks[0].offsetTop - 100);
                els.backdrop.scrollTo({top: pos, behavior:'smooth'}); els.input.scrollTo({top: pos, behavior:'smooth'});
            }
        };

        function renderIssues() {
            const total = state.spellIssues.length + state.contextIssues.length;
            if(total > 0) { els.issueCount.innerText = `พบทั้งหมด ${total} จุด`; els.issueCount.classList.remove('hidden'); } 
            else { els.issueCount.classList.add('hidden'); }

            if(total === 0) {
                els.proofreadContent.innerHTML = `<div class="h-full min-h-[400px] flex flex-col items-center justify-center text-gray-400 text-center"><i data-lucide="check-circle-2" class="w-10 h-10 text-gray-300 mb-4"></i><p class="text-sm">เนื้อหาพร้อมใช้งาน หรือยังไม่ได้ทำการตรวจสอบ</p></div>`;
            } else {
                let html = '<div class="space-y-6">';
                if(state.spellIssues.length > 0) {
                    html += `<div class="space-y-3"><h4 class="text-sm font-semibold text-red-600 flex items-center gap-2 border-b border-red-100 pb-2"><span class="w-2 h-2 rounded-full bg-red-500"></span> ตรวจคำผิด / การเว้นวรรค (${state.spellIssues.length})</h4>`;
                    state.spellIssues.forEach(iss => {
                        html += `<div class="bg-red-50/50 border border-red-100 rounded-sm p-3 flex flex-col sm:flex-row justify-between gap-3"><div class="flex-1"><div class="flex items-center gap-2 mb-1"><span class="text-red-500 line-through text-sm">"${iss.wrong}"</span><span class="text-gray-400 text-xs">→</span><span class="text-green-600 font-medium text-sm">"${iss.correct}"</span></div><p class="text-xs text-gray-500 mt-1">${iss.reason}</p></div><div class="flex items-center gap-1.5 shrink-0"><button onclick="locateIssue('${iss.wrong}')" class="px-2 py-1 text-xs border border-gray-200 text-gray-600 hover:bg-white rounded-sm"><i data-lucide="search" class="w-3 h-3"></i></button><button onclick="handleReplace('${iss.wrong}', '${iss.correct}', 'spell')" class="px-3 py-1 text-xs bg-red-100 hover:bg-red-200 text-red-700 rounded-sm font-medium flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> แก้ไข</button></div></div>`;
                    }); html += `</div>`;
                }
                if(state.contextIssues.length > 0) {
                    html += `<div class="space-y-3"><h4 class="text-sm font-semibold text-amber-600 flex items-center gap-2 border-b border-amber-100 pb-2 mt-4"><span class="w-2 h-2 rounded-full bg-amber-500"></span> คำพิมพ์ตก / ประโยคสงสัย (${state.contextIssues.length})</h4>`;
                    state.contextIssues.forEach(iss => {
                        html += `<div class="bg-amber-50/50 border border-amber-100 rounded-sm p-3 flex flex-col sm:flex-row justify-between gap-3"><div class="flex-1"><div class="flex items-center gap-2 mb-1"><span class="text-amber-600 font-medium text-sm">"${iss.wrong}"</span>${iss.correct && iss.correct !== iss.wrong ? `<span class="text-gray-400 text-xs">→</span><span class="text-green-600 text-sm">แนะนำ: "${iss.correct}"</span>` : ''}</div><p class="text-xs text-gray-500 mt-1 flex items-start gap-1"><i data-lucide="alert-triangle" class="w-3 h-3 text-amber-500 mt-0.5"></i> ${iss.reason}</p></div><div class="flex items-center gap-1.5 shrink-0"><button onclick="locateIssue('${iss.wrong}')" class="px-2 py-1 text-xs border border-gray-200 text-gray-600 hover:bg-white rounded-sm"><i data-lucide="search" class="w-3 h-3"></i></button><button onclick="handleReplace('${iss.wrong}', '${iss.correct}', 'context')" class="px-3 py-1 text-xs bg-amber-100 hover:bg-amber-200 text-amber-700 rounded-sm font-medium flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> แก้ไข</button></div></div>`;
                    }); html += `</div>`;
                }
                html += '</div>';
                els.proofreadContent.innerHTML = html;
            }
            lucide.createIcons();
        }

        async function fetchAPI(endpoint, text) {
            const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
            if(!res.ok) throw new Error('การเชื่อมต่อกับ AI ล้มเหลว กรุณาลองใหม่');
            return await res.json();
        }

        els.btnProofread.addEventListener('click', async () => {
            if(!state.inputText.trim()) return showError('กรุณาวางข้อความก่อนตรวจ');
            hideError(); els.btnProofread.disabled = true; els.btnProcess.disabled = true;
            els.btnProofread.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> <span>กำลังตรวจ...</span>`; lucide.createIcons();
            try {
                const data = await fetchAPI('/api/proofread', state.inputText);
                const safeWords = ["เพราะ", "จึง", "และ", "หรือ", "แต่", "ที่", "ซึ่ง", "อัน", "จาก", "ใน", "การ", "ความ", "ให้", "ไป", "มา", "ด้วย", "กับ", "แก่", "แด่", "ต่อ"];
                state.spellIssues = (data.spellIssues || []).filter(i => !safeWords.includes(i.wrong.trim()));
                state.contextIssues = (data.contextIssues || []).filter(i => !safeWords.includes(i.wrong.trim()));
                renderHighlights(); renderIssues();
            } catch(e) { showError(e.message); } 
            finally { els.btnProofread.disabled = false; els.btnProcess.disabled = false; els.btnProofread.innerHTML = `<i data-lucide="search" class="w-4 h-4"></i> <span>Proofread</span>`; lucide.createIcons(); }
        });

        els.btnProcess.addEventListener('click', async () => {
            if(!state.inputText.trim()) return showError('กรุณาวางข้อความก่อนจัดหน้า');
            hideError(); els.btnProofread.disabled = true; els.btnProcess.disabled = true; els.output.classList.add('hidden'); els.processLoading.classList.remove('hidden');
            els.btnProcess.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> <span>กำลังจัดหน้า...</span>`; lucide.createIcons();
            try {
                const data = await fetchAPI('/api/process', state.inputText);
                const safeText = (data.cleanedText && data.cleanedText.length >= state.inputText.length * 0.8) ? data.cleanedText : state.inputText.trim();
                const rawParas = safeText.split('\n').filter(p => p.trim() !== '');
                
                state.outputs.website = safeText + "\n\nอ้างอิง:\n" + (data.references || "ไม่มีอ้างอิง");
                state.outputs.facebook = rawParas.join("\n.\n") + "\n.\n" + (data.hashtags || "");
                state.outputs.instagram = rawParas.join("\n\n") + "\n\nอ่านบทความฉบับเต็มต่อที่เว็บไซต์/Facebook: Thairath Plus\n\n" + (data.hashtags || "");
                state.outputs.infocus = data.inFocus || "";

                els.output.value = state.outputs[state.activeTab];
                updateStats(); toggleCopyBtn(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } catch(e) { showError(e.message); } 
            finally { els.btnProofread.disabled = false; els.btnProcess.disabled = false; els.output.classList.remove('hidden'); els.processLoading.classList.add('hidden'); els.btnProcess.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i> <span>Process Text</span>`; lucide.createIcons(); }
        });
    </script>
</body>
</html>
